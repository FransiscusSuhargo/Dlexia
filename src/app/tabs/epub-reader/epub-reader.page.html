<ion-header>
  <ion-toolbar>
    <ion-title>EPUB Reader</ion-title>
    <ion-spinner *ngIf="!rendition" slot="end"></ion-spinner>
    <ion-buttons slot="end">
      <ion-button (click)="toggleTtsControls()">
        <ion-icon name="mic"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [class.with-tts-padding]="showTtsControls" fullscreen>
  <div #viewer id="viewer" style="height: 100%; width: 100%"></div>
</ion-content>

<!-- TTS Control Panel -->
<ion-footer *ngIf="showTtsControls">
  <ion-toolbar>
    <ion-grid>
      <ion-row>
        <ion-col size="6">
          <ion-buttons>
            <ion-button [disabled]="tts.isSpeaking" (click)="playTts()">
              <ion-icon name="play"></ion-icon>
            </ion-button>
            <ion-button [disabled]="!tts.isSpeaking" (click)="pauseTts()">
              <ion-icon name="pause"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-col>
        <ion-col size="6">
          <ion-range
            min="0.5"
            max="2"
            step="0.1"
            [value]="tts.settings.rate"
            (ionChange)="setTtsSpeed($event)"
            aria-label="Speed"
          >
            <ion-label slot="start">Slow</ion-label>
            <ion-label slot="end">Fast</ion-label>
          </ion-range>
        </ion-col>
      </ion-row>
      <ion-row *ngIf="tts.voices.length > 0">
        <ion-col>
          <ion-select
            [value]="tts.settings.voiceIndex"
            (ionChange)="setTtsVoice($event)"
            interface="popover"
            placeholder="Select Voice"
          >
            <ion-select-option
              *ngFor="let voice of tts.voices; let i = index"
              [value]="i"
            >
              {{voice.name}} ({{voice.lang}})
            </ion-select-option>
          </ion-select>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-footer>
