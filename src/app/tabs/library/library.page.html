<ion-header>
  <ion-toolbar>
    <ion-title>Library</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (loading) {
    <div class="loading-container">
      <ion-spinner></ion-spinner>
    </div>
  } @else if (books.length === 0) {
    <div class="empty-state">
      <ion-icon name="library-outline"></ion-icon>
      <p>No books found. Upload your first EPUB!</p>
    </div>
  } @else {
    <ion-list>
      <ion-card 
        *ngFor="let book of books" 
        (click)="openBook(book)" 
        style="width: 80%; height: auto; margin: 25px 10%; cursor: pointer;">
        
        <img alt="Book cover" src="{{book.metadata.coverImage}}" (error)="handleImageError($event)"/>

        <ion-card-header>
          <ion-card-title>{{book.metadata.title}}</ion-card-title>
          <ion-card-subtitle>{{book.metadata.author}}</ion-card-subtitle>
        </ion-card-header>
        
        <ion-card-content>
          {{book.addedDate}}
        </ion-card-content>
      </ion-card>
    </ion-list>
  }

  <ion-fab slot="fixed" vertical="bottom" horizontal="end" style="margin: 20% 6%;">
    <app-file-upload (filesProcessed)="loadLibrary()">
      <ion-fab-button style="--color: #FFEECE; border-radius: 50%; --background: #92A695;">
        <ion-icon name="add"></ion-icon>
      </ion-fab-button>
    </app-file-upload>
  </ion-fab>

</ion-content>
