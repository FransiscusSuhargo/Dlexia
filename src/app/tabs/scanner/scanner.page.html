<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>scanner</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  
  <div class="scanned-container">
    <h2>Scanned Document</h2>
    <img id="scannedImage" alt="Scanned Document" />
  </div>  
  <ion-list>
    <ion-item>
      <ion-text style="white-space: pre-wrap; word-break: break-word; text-align: left;">
        {{ detectedText }}
      </ion-text>
    </ion-item>
  </ion-list>

  <ion-button expand="full" (click)="scanDocument()">
    <ion-icon slot="start" name="camera"></ion-icon> 
    Scan Document</ion-button>

</ion-content>
