<ion-content fullscreen>
  <div #viewer id="viewer" style="height: 100%; width: 100%"></div>

  <!-- TTS FAB (only visible in normal mode) -->
  <ion-fab
    *ngIf="rsvpState === 'stopped'"
    vertical="bottom"
    horizontal="end"
    slot="fixed"
  >
    <ion-fab-button
      (click)="toggleTts()"
      style="--color: #ffeece; --background: #92a695"
    >
      {{ ttsState === 'playing' ? '⏸' : '▶' }}
    </ion-fab-button>
  </ion-fab>

  <!-- RSVP Trigger FAB (only visible in normal mode) -->
  <ion-fab
    *ngIf="rsvpState === 'stopped'"
    vertical="bottom"
    horizontal="start"
    slot="fixed"
  >
    <ion-fab-button
      (click)="toggleRsvp()"
      style="--color: #ffeece; --background: #92a695"
    >
      RSVP
    </ion-fab-button>
  </ion-fab>

  <!-- RSVP Overlay (full screen when active) -->
  <div *ngIf="rsvpState !== 'stopped'" class="rsvp-overlay">
    <div class="rsvp-word">{{ currentRsvpWord }}</div>

    <!-- RSVP Controls -->
    <div class="rsvp-controls">
      <ion-fab vertical="bottom" horizontal="start" slot="fixed">
        <ion-fab-button
          (click)="toggleRsvp()"
          style="--color: #ffeece; --background: #92a695"
        >
          Back
        </ion-fab-button>
      </ion-fab>

      <ion-fab vertical="bottom" horizontal="end" slot="fixed">
        <ion-fab-button
          (click)="toggleRsvpPlayback()"
          style="--color: #ffeece; --background: #92a695"
        >
          {{ rsvpState === 'playing' ? '⏸' : '▶' }}
        </ion-fab-button>
      </ion-fab>
    </div>
  </div>
</ion-content>
