<ion-header>
  <ion-toolbar>
    <ion-title>EPUB Reader</ion-title>
    <ion-spinner *ngIf="!rendition" slot="end"></ion-spinner>
    <ion-buttons slot="end">
      <ion-button (click)="toggleTtsControls()">
        MICs
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>
  <div #viewer id="viewer" style="height: 100%; width: 100%"></div>

  <!-- TTS Controls INSIDE content with fixed positioning -->
  <div class="tts-controls">
    <ion-toolbar>
      <!-- Your existing control content -->
      <ion-grid>
        <ion-row>
          <ion-col size="6">
            <ion-buttons>
              <ion-button (click)="playTts()"> PLAY </ion-button>
              <ion-button [disabled]="!tts.isSpeaking" (click)="pauseTts()">
                PAUSEs
              </ion-button>
            </ion-buttons>
          </ion-col>
          <ion-col size="6">
            <ion-range
              min="0.5"
              max="2"
              step="0.1"
              [value]="tts.currentRate"
              (ionChange)="tts.setSpeed(+$event.detail.value)"
            >
              <ion-label slot="start">Slow</ion-label>
              <ion-label slot="end">Fast</ion-label>
            </ion-range>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-toolbar>
  </div>
</ion-content>
